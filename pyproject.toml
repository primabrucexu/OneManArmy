[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "one-man-army"
version = "0.1.0"
description = "A local Codex-powered software delivery workspace."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "openai-codex",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[project.scripts]
onemanarmy = "onemanarmy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onemanarmy = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
